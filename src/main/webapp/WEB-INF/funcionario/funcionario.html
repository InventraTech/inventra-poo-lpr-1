
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel do usuário - Inventra</title>
    
    <link rel="stylesheet" href="../../utils/css/funcionario.css">
    <link rel="stylesheet" href="../../utils/css/preLista.css">
    <link rel="stylesheet" href="../../utils/css/requisicoes.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <header class="header">
        <a href="#modal-menu" class="botao-menu" aria-label="Abrir menu">
            <i data-lucide="menu"></i>
        </a>
        <a href="funcionario.html" class="header-user"
           aria-label="Abrir painel do usuário">
            <span class="user-name">Nelson Junior</span>
            <div class="user-avatar">
                <i data-lucide="user"></i>
            </div>
        </a>

    </header>
    <div class="menu-lateral" id="modal-menu">

        <a href="#" class="menu-fundo" aria-label="Fechar menu"></a>

        <nav class="menu-painel">

            <a href="#" class="menu-fechar" aria-label="Fechar menu">
                <i data-lucide="☰"></i>
            </a>

            <ul class="menu-itens">
                <li>
                    <a href="index.html" class="menu-item">
                        Página inicial
                    </a>
                </li>

                <li>
                    <a href="estoque.html" class="menu-item">
                        Estoque
                    </a>
                </li>

                <li>
                    <a href="fornecedores.html" class="menu-item">
                        Fornecedores
                    </a>
                </li>

                <li>
                    <a href="../requisicoes/requisicoes.html" class="menu-item">
                        Requisições
                    </a>
                </li>

                <li>
                    <a href="lotes.html" class="menu-item">
                        Lotes
                    </a>
                </li>

                <li>
                    <a href="pre-listas.html" class="menu-item">
                        Pré Listas
                    </a>
                </li>
            </ul>

            <a href="#" class="menu-saida">
                Saída
            </a>

        </nav>
    </div>
    <main class="painel-usuario">

        <section class="titulo-usuario">

            <div class="icone-titulo">
                <i data-lucide="package-check"></i>
            </div>

            <div>
                <h1>Painel do usuário</h1>
                <p>Seus dados, preferências e atividade no Inventra</p>
            </div>

        </section>

        <section class="cartao-perfil">

            <div class="foto-perfil">
                <i data-lucide="user-round"></i>

                <button type="button" class="editar-foto"
                        id="botao-foto" aria-label="Alterar foto">
                    <i data-lucide="pencil"></i>
                </button>
            </div>

            <div class="informacoes-perfil">
                <h2 id="nome-exibido">Nelson Junior</h2>
                <p id="email-exibido">nelson@junior123.com</p>
            </div>

            <span class="etiqueta-cargo" id="cargo-exibido">
                Estoquista
            </span>

        </section>

        <form id="form-usuario">

            <section class="secao-usuario">

                <div class="titulo-secao">
                    <i data-lucide="user-round"></i>
                    <h2>Dados pessoais</h2>
                </div>

                <div class="campo campo-completo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="grade-campos">

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@exemplo.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(11) 99999-9999"
                            autocomplete="tel"
                            inputmode="numeric"
                            maxlength="15"
                        >
                    </div>

                    <div class="campo">
                        <label for="cargo">Cargo</label>
                        <input
                            type="text"
                            id="cargo"
                            name="cargo"
                            placeholder="Ex.: Estoquista"
                        >
                    </div>

                    <div class="campo">
                        <label for="empresa">Empresa</label>
                        <input
                            type="text"
                            id="empresa"
                            name="empresa"
                            placeholder="Nome da empresa"
                            autocomplete="organization"
                        >
                    </div>

                </div>

            </section>

            <!-- PREFERÊNCIAS -->
            <section class="secao-usuario">

                <div class="titulo-secao">
                    <i data-lucide="calendar-clock"></i>
                    <h2>Preferências</h2>
                </div>

                <label class="preferencia" for="alerta-estoque">

                    <span class="texto-preferencia">
                        <strong>Alertas de estoque baixo</strong>
                        <small>
                            Avisar quando um produto chegar ao nível mínimo.
                        </small>
                    </span>

                    <input
                        type="checkbox"
                        id="alerta-estoque"
                        name="alertaEstoque"
                        class="interruptor"
                        checked
                    >

                    <span class="interruptor-visual"></span>

                </label>

                <label class="preferencia" for="resumo-semanal">

                    <span class="texto-preferencia">
                        <strong>Resumo semanal do estoque</strong>
                        <small>
                            Receber um panorama do estoque toda segunda-feira.
                        </small>
                    </span>

                    <input
                        type="checkbox"
                        id="resumo-semanal"
                        name="resumoSemanal"
                        class="interruptor"
                    >

                    <span class="interruptor-visual"></span>

                </label>

            </section>

            <!-- TROCAR DE CONTA -->
            <button type="button" class="trocar-conta" id="trocar-conta">

                <span class="icone-conta">
                    <i data-lucide="users-round"></i>
                </span>

                <span>Trocar de conta</span>

                <i data-lucide="arrow-right" class="seta-conta"></i>

            </button>

            <!-- SALVAR -->
            <div class="acoes-usuario">

                <p id="mensagem-salvamento" aria-live="polite"></p>

                <button type="submit" class="botao-salvar">
                    <i data-lucide="save"></i>
                    <span>Salvar alterações</span>
                </button>

            </div>

        </form>

    </main>

    <!-- FUNCIONALIDADES -->
    <script>
        lucide.createIcons();

        const formulario = document.getElementById("form-usuario");
        const campoTelefone = document.getElementById("telefone");
        const mensagem = document.getElementById("mensagem-salvamento");

        const campos = {
            nome: document.getElementById("nome"),
            email: document.getElementById("email"),
            telefone: campoTelefone,
            cargo: document.getElementById("cargo"),
            empresa: document.getElementById("empresa"),
            alertaEstoque: document.getElementById("alerta-estoque"),
            resumoSemanal: document.getElementById("resumo-semanal")
        };

        // Formatação automática do telefone brasileiro
        campoTelefone.addEventListener("input", function () {
            let numeros = this.value.replace(/\D/g, "").slice(0, 11);

            if (numeros.length === 0) {
                this.value = "";
                return;
            }

            if (numeros.length <= 2) {
                this.value = "(" + numeros;
            } else if (numeros.length <= 6) {
                this.value =
                    "(" + numeros.slice(0, 2) + ") " +
                    numeros.slice(2);
            } else if (numeros.length <= 10) {
                this.value =
                    "(" + numeros.slice(0, 2) + ") " +
                    numeros.slice(2, 6) + "-" +
                    numeros.slice(6);
            } else {
                this.value =
                    "(" + numeros.slice(0, 2) + ") " +
                    numeros.slice(2, 7) + "-" +
                    numeros.slice(7);
            }
        });

        // Atualiza os dados exibidos no cartão de perfil
        function atualizarPerfil() {
            document.getElementById("nome-exibido").textContent =
                campos.nome.value || "Nome do usuário";

            document.getElementById("email-exibido").textContent =
                campos.email.value || "E-mail não informado";

            document.getElementById("cargo-exibido").textContent =
                campos.cargo.value || "Cargo não informado";
        }

        // Carrega os dados salvos no navegador
        const dadosSalvos = localStorage.getItem("inventraUsuario");

        if (dadosSalvos) {
            try {
                const dados = JSON.parse(dadosSalvos);

                Object.keys(campos).forEach(function (chave) {
                    if (dados[chave] !== undefined) {
                        if (campos[chave].type === "checkbox") {
                            campos[chave].checked = dados[chave];
                        } else {
                            campos[chave].value = dados[chave];
                        }
                    }
                });
            } catch (erro) {
                console.error("Não foi possível carregar os dados salvos.", erro);
            }
        } else {
            campos.nome.value = "Nelson da Silva Souza Santos Junior";
            campos.email.value = "nelson@junior123.com";
            campos.cargo.value = "Estoquista";
        }

        atualizarPerfil();

        // Atualiza o cartão conforme os campos são editados
        campos.nome.addEventListener("input", atualizarPerfil);
        campos.email.addEventListener("input", atualizarPerfil);
        campos.cargo.addEventListener("input", atualizarPerfil);

        // Salva os dados
        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();

            const dados = {};

            Object.keys(campos).forEach(function (chave) {
                if (campos[chave].type === "checkbox") {
                    dados[chave] = campos[chave].checked;
                } else {
                    dados[chave] = campos[chave].value.trim();
                }
            });

            try {
                localStorage.setItem("inventraUsuario", JSON.stringify(dados));
                mensagem.textContent = "Alterações salvas com sucesso!";
                atualizarPerfil();
            } catch (erro) {
                mensagem.textContent = "Não foi possível salvar os dados neste navegador.";
            }
        });

        // Ação provisória para trocar de conta
        document.getElementById("trocar-conta").addEventListener("click", function () {
            mensagem.textContent =
                "A troca de conta precisa ser conectada ao sistema de autenticação.";
        });

        // A foto ainda não está conectada a um upload de imagem
        document.getElementById("botao-foto").addEventListener("click", function () {
            mensagem.textContent =
                "A alteração da foto será implementada em uma próxima etapa.";
        });
    </script>

</body>
</html>
