<div class="modal-lote" id="modal-lote">
    <a href="#" class="modal-lote-fundo" aria-label="Fechar modal"></a>

    <section class="modal-lote-conteudo" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-lote">
        <a href="#" class="modal-lote-fechar" aria-label="Fechar">×</a>

        <h2 id="titulo-modal-lote">Novo Lote</h2>

        <form class="formulario-lote">
            <div class="campo-lote campo-lote-completo">
                <label for="produto-lote">Produto</label>
                <input type="text" id="produto-lote" placeholder="Ex: arroz">
            </div>

            <div class="campo-lote">
                <label for="numero-lote">Número do Lote</label>
                <input type="text" id="numero-lote" placeholder="Ex: L00123">
            </div>

            <div class="campo-lote">
                <label for="validade-lote">Data de validade</label>
                <input type="date" id="validade-lote">
            </div>

            <div class="campo-lote">
                <label for="quantidade-lote">Quantidade</label>
                <input type="number" id="quantidade-lote" placeholder="Ex: 100">
            </div>

            <div class="campo-lote">
                <label for="unidade-lote">Unidade de medida</label>
                <input type="text" id="unidade-lote" placeholder="Ex: Kg, L, UN...">
            </div>

            <div class="campo-lote">
                <label for="fornecedor-lote">Fornecedor</label>
                <select id="fornecedor-lote">
                    <option value="">Selecionar fornecedor</option>
                </select>
            </div>

            <div class="campo-lote">
                <label for="custo-lote">Custo de aquisição</label>
                <input type="number" id="custo-lote" placeholder="Ex: 50,00" step="0.01">
            </div>

            <div class="campo-lote campo-lote-completo">
                <label for="descricao-lote">Descrição</label>
                <input type="text" id="descricao-lote" placeholder="Detalhes adicionais sobre o produto">
            </div>

            <label class="fornecedor-ativo-lote">
                <input type="checkbox" checked>
                <span class="interruptor-lote"></span>
                Fornecedor ativo
            </label>

            <div class="acoes-modal-lote">
                <a href="#" class="cancelar-lote">Cancelar</a>
                <button type="submit" class="salvar-lote">Salvar</button>
            </div>
        </form>
    </section>
</div>
