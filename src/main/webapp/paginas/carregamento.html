<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventra Admin - Carregando</title>
    <link rel="icon" type="image/png" href="../utils/imagens/imagotipo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../utils/css/style_carregamento.css">
</head>
<body>
    <div id="tela_carregamento">
        <div id="logo_admin">
            <img id="logo_icone" src="../utils/imagens/imagotipo.png" alt="Ícone Inventra">
            <img id="logo_nome" src="../utils/imagens/logotipo.png" alt="Inventra">
            <span id="logo_admin_texto">ADMIN</span>
        </div>

        <p id="texto_carregando">Verificando dados...</p>

        <svg id="carregador" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g id="hexagono">
                <path id="hexagono_tracos" d="M 34.7 70.75 L 120 21.5 L 205.3 70.75 L 205.3 169.25 L 120 218.5 L 34.7 169.25 Z"/>
            </g>
        </svg>
    </div>

    <script>
        // Mantém a tela pelo menos 3 s e só troca de página depois que o login.jsp responde
        // (com teto de 10 s, para a tela não ficar presa se o servidor demorar demais).
        const DESTINO = '../login.jsp';
        const TEMPO_MINIMO = 3000;
        const TEMPO_MAXIMO_LOGIN = 10000;

        const esperar = ms => new Promise(resolver => setTimeout(resolver, ms));

        Promise.all([
            Promise.race([
                fetch(DESTINO).catch(() => null),
                esperar(TEMPO_MAXIMO_LOGIN)
            ]),
            esperar(TEMPO_MINIMO)
        ]).then(() => {
            // replace: o botão "voltar" não volta para esta tela de carregamento.
            window.location.replace(DESTINO);
        });
    </script>
</body>
</html>
