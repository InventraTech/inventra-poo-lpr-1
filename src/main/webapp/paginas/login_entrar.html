<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventra - Entrar</title>
    <link rel="icon" type="Image/png" href="../utils/imagens/imagotipo.png">
    <link rel="stylesheet" href="../utils/css/style_login_entrar.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap');
    </style>

</head>
<body>

<img class="elemento_login" src="../utils/imagens/elemento_login.svg" alt="">
<a href="../index.html">
    <img class="voltarInicio" src="../utils/imagens/voltar_inicio.svg" alt="">
</a>
<img class="mascote" src="../utils/imagens/caixito.png" alt="">

<div id="login">
    <header>
        <div class="A">
            <a href="../index.html">
                <img class="voltarLogin" src="../utils/imagens/voltar_login.svg" alt="">
            </a>
            <img class="imagotipo" src="../utils/imagens/imagotipo.png" width="50">
        </div>
        <h1 id="title">Comece com o <span id="roxo">Inventra</span></h1>
        <p id="descricao_head">Crie sua conta gratuita ou entre para continuar.</p>
    </header>

    <button class="botoes_entrar_conta">
        <img src="../utils/imagens/google_logo.png">
        <p>Continuar com Google</p>
    </button>

    <button class="botoes_entrar_conta">
        <img src="../utils/imagens/microsoft_logo.png">
        <p>Continuar com Microsoft</p>
    </button>

    <div id="separador">
        <div class="linha"></div>
        <span>ou com e-mail</span>
        <div class="linha"></div>
    </div>

    <div id="trocar_de_log">
        <a class="link_botao" href="login_criar_conta.html">
            <button  id="criar_cont" class="botao_padrao">
                Criar conta
            </button>
        </a>

        <button  id="entrar_cont" class="botao_padrao">
            <p>Entrar</p>
        </button>
    </div>

    <form id="form_entrar" action="aba_pagamento.html">
        <label for="email">E-mail</label><br>
        <input  id="email" name="email" type="email" placeholder="voce@empresa.com" required><br>
        <label for="senha">Senha</label><br>
        <input  id="senha" name="senha" type="password" placeholder="Digite sua senha" required>
        <a href="aba_pagamento.html" id="entrar_site">
            <p>Entrar na conta</p>
        </a>
    </form>

    <footer>
        <p>Ao criar uma conta, você concorda com nossos Termos e<br> Política de Privacidade.</p>
    </footer>

</div>

<script>
    const form = document.getElementById("form_entrar");
    const botaoEntrar = document.getElementById("entrar_site");

    botaoEntrar.addEventListener("click", function (evento) {
        evento.preventDefault();

        if (form.reportValidity()) {
            window.location.href = botaoEntrar.getAttribute("href");
        }
    });

    form.addEventListener("submit", function (evento) {
        evento.preventDefault();
        botaoEntrar.click();
    });
</script>

</body>
</html>
